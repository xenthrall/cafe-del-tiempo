# Este compose usa .env.docker (no .env) tanto para inyectar variables a los
# contenedores como para interpolar ${DB_DATABASE}/${DB_USERNAME}/${DB_PASSWORD}
# en este mismo archivo. Docker Compose solo lee un archivo `.env` automático
# para interpolación, así que TODO comando debe pasar el flag explícito:
#
#   docker compose --env-file .env.docker up -d --build
#
# Copia .env.docker.example a .env.docker antes de la primera vez.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cafe-del-tiempo-app:latest
    container_name: cafe-del-tiempo_app
    restart: always
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/var/www/html/.env
      - app_storage:/var/www/html/storage
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/php-production.ini:/usr/local/etc/php/conf.d/zz-production.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cafe-del-tiempo-network

  nginx:
    image: nginx:alpine
    container_name: cafe-del-tiempo_nginx
    restart: always
    ports:
      - "9000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - cafe-del-tiempo-network

  postgres:
    image: postgres:16-alpine
    container_name: cafe-del-tiempo_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cafe_del_tiempo}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cafe-del-tiempo-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: cafe-del-tiempo-app:latest
    container_name: cafe-del-tiempo_queue
    restart: always
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3 --max-time=3600
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/var/www/html/.env
      - app_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - cafe-del-tiempo-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: cafe-del-tiempo-app:latest
    container_name: cafe-del-tiempo_scheduler
    restart: always
    init: true
    command: php artisan schedule:work
    env_file:
      - .env.docker
    volumes:
      - ./.env.docker:/var/www/html/.env
      - app_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - cafe-del-tiempo-network

networks:
  cafe-del-tiempo-network:
    driver: bridge

volumes:
  postgres_data:
  app_storage:
