image: php:8.3-cli

definitions:
  caches:
    composer: vendor

  steps:
    # CI - Tests automatizados
    #
    # Este step está preparado pero NO se ejecuta actualmente.
    # Se mantiene definido para poder activarlo posteriormente.
    #
    # Al activarlo en "pull-requests", los tests consumirán minutos
    # de Bitbucket Pipelines. Actualmente se encuentra deshabilitado
    # para conservar los 50 minutos mensuales disponibles.
    #
    # Para activarlo:
    #
    # pull-requests:
    #   '**':
    #     - step: *tests
    #
    - step: &tests
        name: Tests
        caches:
          - composer
        script:
          - apt-get update && apt-get install -y --no-install-recommends git unzip libicu-dev libzip-dev libpq-dev > /dev/null
          - docker-php-ext-configure intl
          - docker-php-ext-install intl zip pdo_pgsql > /dev/null
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          - composer install --no-interaction --prefer-dist
          - cp .env.example .env
          - php artisan key:generate
          - vendor/bin/pint --test
          - php artisan test --compact

pipelines:

  # CI - Pull Requests
  #
  # DESHABILITADO TEMPORALMENTE:
  # Los tests están definidos arriba, pero no se ejecutan automáticamente
  # para evitar consumir los minutos mensuales de Bitbucket Pipelines.
  #
  # Para habilitar CI posteriormente, descomentar:
  #
  # pull-requests:
  #   '**':
  #     - step: *tests

  branches:
    main:

      # CD - Deploy a producción
      #
      # El despliegue es MANUAL intencionalmente.
      # Al hacer push a main, Bitbucket prepara el pipeline pero espera
      # confirmación manual antes de conectarse al VPS y desplegar.
      #
      # Esto permite revisar el pipeline antes de modificar producción.
      - step:
          name: Desplegar a producción (Manual)
          deployment: production
          trigger: manual

          script:
            - pipe: atlassian/ssh-run:0.4.0
              variables:
                SSH_USER: $DEPLOY_SSH_USER
                SERVER: $DEPLOY_SSH_HOST
                SSH_KEY: $DEPLOY_SSH_KEY
                COMMAND: |
                  cd /home/xenthrall/cafe-del-tiempo &&
                  git pull origin main &&
                  sudo docker compose up -d --build &&
                  sudo docker compose exec -T app php artisan migrate --force
