image: php:8.3-cli

definitions:
  caches:
    composer: vendor

  steps:
    # CI - Tests automatizados
    #
    # DESHABILITADO TEMPORALMENTE para ahorrar los minutos disponibles
    # de Bitbucket Pipelines mientras se configura y prueba el pipeline.
    #
    # Para activar los tests automáticamente en cada Pull Request,
    # eliminar los '#' de las siguientes líneas:
    #
    # pull-requests:
    #   '**':
    #     - step: *tests
    #
    - step: &tests
        name: Tests
        caches:
          - composer
        script:
          - apt-get update && apt-get install -y --no-install-recommends git unzip libicu-dev libzip-dev libpq-dev > /dev/null
          - docker-php-ext-configure intl
          - docker-php-ext-install intl zip pdo_pgsql > /dev/null
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          - composer install --no-interaction --prefer-dist
          - cp .env.example .env
          - php artisan key:generate
          - vendor/bin/pint --test
          - php artisan test --compact

pipelines:

  # CI - Pull Requests
  #
  # DESHABILITADO TEMPORALMENTE para ahorrar minutos de Bitbucket.
  #
  # Para activarlo posteriormente:
  #
  # pull-requests:
  #   '**':
  #     - step: *tests

  # CD - Deploy a producción
  #
  # Pipeline manual ejecutado desde la interfaz de Bitbucket.
  #
  # No se ejecuta automáticamente al hacer push a main.
  custom:
    deploy-production:
      - step:
          name: Desplegar a producción
          deployment: production
          script:
            - pipe: atlassian/ssh-run:0.4.0
              variables:
                SSH_USER: $DEPLOY_SSH_USER
                SERVER: $DEPLOY_SSH_HOST
                SSH_KEY: $DEPLOY_SSH_KEY
                COMMAND: |
                  cd /home/xenthrall/cafe-del-tiempo &&
                  git pull origin main &&
                  sudo docker compose up -d --build &&
                  sudo docker compose exec -T app php artisan migrate --force
